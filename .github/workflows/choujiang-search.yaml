name: 嘉立创中奖记录查询脚本-无代理

on:
  workflow_dispatch:  # 手动触发
    inputs:
      jlc_usernames:
        description: '输入账号列表 (多个账号请用英文逗号分隔)'
        required: true
        type: string
      jlc_passwords:
        description: '输入密码列表 (需与账号一一对应，用英文逗号分隔)'
        required: true
        type: string

jobs:
  # 第一步：计算分组
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: 计算分组索引
        id: set-matrix
        env:
          # 从用户填写的表单中获取账号数据
          ALL_USERS: ${{ github.event.inputs.jlc_usernames }}
        run: |
          python3 -c "
          import os, json, math
          
          users_raw = os.environ.get('ALL_USERS', '')
          
          clean_raw = users_raw.replace('\n', '').replace('\r', '')
          users = [u.strip() for u in clean_raw.split(',') if u.strip()]
          
          total_count = len(users)
          print(f'DEBUG: Detected {total_count} accounts.')
          
          group_size = 50
          if total_count == 0:
              chunks = 1
          else:
              chunks = math.ceil(total_count / group_size)
          
          # === 从1开始 ===
          matrix_list = list(range(1, chunks + 1))
          
          print(f'Total Groups: {chunks}')
          print(f'Matrix: {matrix_list}')
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'matrix={json.dumps(matrix_list)}\n')
          "

  # 第二步：并行运行
  run-with-account:
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        group_idx: ${{ fromJson(needs.prepare.outputs.matrix) }}
        
    steps:
      - name: '检出代码'
        uses: actions/checkout@v6

      - name: '设置Python环境'
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          
      - name: '设置Node.js环境'
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: '设置时区为北京时间'
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          echo "当前时间: $(date)"

      - name: '安装依赖'
        run: |
          pip install --upgrade pip
          pip install requests==2.26.0
          pip install lxml==4.6.5
          pip install selenium==3.141.0
          pip install retrying==1.3.3
          pip install wheel==0.37.1
          pip install serverchan_sdk==1.0.6
          pip install PyExecJS
          pip install psutil
          pip install DrissionPage DataRecorder DownloadKit

      - name: '准备Chrome驱动'
        uses: nanasess/setup-chromedriver@v2

      - name: '安装Xvfb虚拟显示器'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: '启动虚拟显示器'
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: '切分当前组账号数据'
        id: slice-secrets
        env:
          # 这里同样替换为从表单输入获取
          ALL_USERS: ${{ github.event.inputs.jlc_usernames }}
          ALL_PASS: ${{ github.event.inputs.jlc_passwords }}
          GROUP_IDX: ${{ matrix.group_idx }}
        run: |
          python3 -c "
          import os
          
          # === 因为索引从1开始，切片时要减1 ===
          idx = int(os.environ.get('GROUP_IDX', 1)) - 1
          size = 50
          
          users_raw = os.environ.get('ALL_USERS', '').replace('\n', '').replace('\r', '')
          pass_raw = os.environ.get('ALL_PASS', '').replace('\n', '').replace('\r', '')
          
          users = [u.strip() for u in users_raw.split(',') if u.strip()]
          passwords = [p.strip() for p in pass_raw.split(',') if p.strip()]
          
          start = idx * size
          end = start + size
          
          current_users = users[start:end]
          current_pass = passwords[start:end] if len(passwords) >= start else []
          
          print(f'Job Index: {idx + 1}')
          print(f'User count: {len(current_users)}')
          
          batch_user_str = ','.join(current_users)
          batch_pass_str = ','.join(current_pass)
          
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'CURRENT_BATCH_USER={batch_user_str}\n')
              f.write(f'CURRENT_BATCH_PASS={batch_pass_str}\n')
          "

      - name: '运行脚本'
        env:
          DISPLAY: ':99'
        run: |
          python ./choujiang-search.py "$CURRENT_BATCH_USER" "$CURRENT_BATCH_PASS" "true"
